[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlextractor"
version = "0.1.0"
description = "Extract SQL strings from source code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
modelgen = [
    "huggingface_hub>=0.31.0",
    "llama-cpp-python>=0.3.7",
]

[tool.setuptools]
package-dir = {"" = "src"}
script-files = ["sqlextractor", "sqlamodelgen"]

[tool.setuptools.packages.find]
where = ["src"]
